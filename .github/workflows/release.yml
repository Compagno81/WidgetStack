name: Build APK and release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore owner signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo 'Configure ANDROID_KEYSTORE_BASE64 and signing secrets before building a release.'; exit 1; }
          mkdir -p signing
          printf '%s' "$KEYSTORE" | base64 --decode > signing/release.keystore
      - name: Test, lint and build signed APK
        env:
          WIDGETSTACK_KEYSTORE: ${{ github.workspace }}/signing/release.keystore
          WIDGETSTACK_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          WIDGETSTACK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WIDGETSTACK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash gradlew clean :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Package matching source and checksum
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/WidgetStack.apk
          git rev-parse HEAD > release/source-commit.txt
          git archive --format=zip HEAD -o release/WidgetStack-source.zip
          cp docs/RELEASE-CANDIDATE.md release/validation-notes.md
          cd release
          sha256sum WidgetStack.apk WidgetStack-source.zip > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: WidgetStack-candidate
          path: release/
      - name: Publish tagged release with APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Widget Stack $GITHUB_REF_NAME" --notes-file docs/RELEASE-CANDIDATE.md --prerelease
