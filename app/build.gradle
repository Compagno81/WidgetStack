plugins { id 'com.android.application' }
android {
 namespace 'com.kevin.widgetstack'
 compileSdk 35
 defaultConfig { applicationId 'com.kevin.widgetstack'; minSdk 31; targetSdk 35; versionCode 37; versionName '1.36-reconstructed'; testInstrumentationRunner 'android.test.InstrumentationTestRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 signingConfigs { debug { storeFile rootProject.file("signing/testing-debug.keystore"); storePassword "android"; keyAlias "AndroidDebugKey"; keyPassword "android" } }
 signingConfigs {
  ownerRelease {
   if (System.getenv('WIDGETSTACK_KEYSTORE')) {
    storeFile file(System.getenv('WIDGETSTACK_KEYSTORE'))
    storePassword System.getenv('WIDGETSTACK_STORE_PASSWORD')
    keyAlias System.getenv('WIDGETSTACK_KEY_ALIAS')
    keyPassword System.getenv('WIDGETSTACK_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { minifyEnabled false; if (System.getenv('WIDGETSTACK_KEYSTORE')) signingConfig signingConfigs.ownerRelease } }
 testOptions { unitTests.includeAndroidResources = true }
 lint { disable 'ProtectedPermissions'; abortOnError true }
}
dependencies {
 androidTestCompileOnly files("${android.sdkDirectory}/platforms/android-35/optional/android.test.runner.jar", "${android.sdkDirectory}/platforms/android-35/optional/android.test.base.jar")
 implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.robolectric:robolectric:4.14.1'
}
